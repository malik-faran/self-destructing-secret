server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never let a secret-bearing URL leak through Referer.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Nginx drops inherited add_header directives in a location that declares
    # its own, so repeat the security headers alongside cache policies.

    location /assets/ {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store";
    }

    # SPA fallback for client-side routes such as /s/<id>.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
